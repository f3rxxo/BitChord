name: Build optimized APK

# A debug-signed APK built the way a release is (R8 shrinking, not debuggable),
# so it runs at release speed without needing a signing key. Installs next to
# the debug build as "com.dev.bitchord.benchmark". Run it by hand from the
# Actions tab; use it to check playback glitches that only a slow debug build
# causes.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      - name: Build dev benchmark APK
        run: ./gradlew assembleDevBenchmark --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-optimized
          path: app/build/outputs/apk/dev/benchmark/*.apk
          if-no-files-found: error