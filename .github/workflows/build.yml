name: Build APK

# Builds an installable, debug-signed APK on every push - no keystore or
# secrets required. Download it from the run's Artifacts section.
on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # Optional Last.fm scrobbling keys. Empty when the secrets aren't set,
      # which only disables scrobbling.
      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      - name: Build dev debug APK
        run: ./gradlew assembleDevDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
